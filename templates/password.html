{% extends "base.html" %}

{% block title %}Alterar senha · Central de Câmeras{% endblock %}

{% block content %}
<div class="page-head">
    <div>
        <h1>Alterar senha</h1>
        <p class="subtitle">Troque a senha de acesso ao sistema.</p>
    </div>
</div>

<div class="card" style="max-width: 560px;">
    {% if error_message %}
    <div class="alert alert-danger" role="alert">{{ error_message }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('change_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="field">
            <label for="current_password">Senha atual</label>
            <input
                type="password"
                id="current_password"
                name="current_password"
                autocomplete="current-password"
                required
                autofocus>
        </div>

        <div class="field">
            <label for="password">Nova senha</label>
            <input
                type="password"
                id="password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                required>
            <span class="hint">Use pelo menos 8 caracteres.</span>
        </div>

        <div class="field">
            <label for="confirmation">Confirme a nova senha</label>
            <input
                type="password"
                id="confirmation"
                name="confirmation"
                autocomplete="new-password"
                minlength="8"
                required>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">Salvar nova senha</button>
            <a href="{{ url_for('index') }}" class="btn">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
