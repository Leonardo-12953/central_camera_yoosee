<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>LEO_SYS // Operações de Segurança</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #030a0f;
            color: #00ffcc;
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
        }
        /* Efeito de scanline (linhas de monitor antigo) */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 99999;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }
        h1, h4, .cyber-title {
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
            letter-spacing: 2px;
        }
        .card-cyber {
            background-color: #071521 !important;
            border: 1px solid #00ffcc44;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
            transition: all 0.3s ease;
        }
        .card-cyber:hover {
            border-color: #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            transform: translateY(-3px);
        }
        .btn-cyber-primary {
            background-color: transparent;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            box-shadow: inset 0 0 8px rgba(0,255,204,0.2);
            transition: 0.2s;
        }
        .btn-cyber-primary:hover {
            background-color: #00ffcc;
            color: #030a0f;
            box-shadow: 0 0 15px #00ffcc;
        }
        .btn-cyber-outline {
            background-color: transparent;
            border: 1px solid #ff0055;
            color: #ff0055;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .btn-cyber-outline:hover {
            background-color: #ff0055;
            color: #fff;
            box-shadow: 0 0 12px #ff0055;
        }
        .text-status {
            color: #ff5555;
            text-shadow: 0 0 5px rgba(255,85,85,0.5);
        }
        .text-status.online {
            color: #00ffcc;
            text-shadow: 0 0 5px rgba(0,255,204,0.5);
        }
    </style>
</head>
<body>
    <div class="container mt-5 mb-5">
        <div class="d-flex justify-content-between align-items-center border-bottom border-secondary pb-3 mb-4">
            <div>
                <h1 class="mb-1">⚡ [LEO_SEC_OPS] // CENTRAL DE MONITORAMENTO</h1>
                <p class="text-muted mb-0">> STATUS: <span class="text-status online">ONLINE (SECURE FEED)</span> | ROTINA DE PURGE: 5 DIAS ATIVA</p>
            </div>
            <div id="live-clock" class="text-end text-warning fs-5">00:00:00</div>
        </div>
        
        <div class="row mt-4">
            {% for cam in cameras %}
            <div class="col-md-4 mb-4">
                <div class="card card-cyber text-light h-100">
                    <div class="card-body d-flex flex-column justify-content-between">
                        <div>
                            <h4 class="card-title text-warning mb-3">◈ {{ cam.friendly_name }}</h4>
                            <p class="card-text small text-white-50 mb-4">NODE_ID: <code class="text-info">{{ cam.original_name }}</code></p>
                        </div>
                        <div>
                            <a href="{{ url_for('view_camera', folder_name=cam.original_name) }}" class="btn btn-cyber-primary w-100 mb-2 py-2">> ACESSAR FEED</a>
                            <button class="btn btn-cyber-outline w-100 py-1" data-bs-toggle="modal" data-bs-target="#renameModal{{ loop.index }}">EDITAR APELIDO</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Cyberpunk -->
            <div class="modal fade" id="renameModal{{ loop.index }}" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content" style="background-color: #071521; border: 1px solid #00ffcc; color: #00ffcc;">
                        <form action="{{ url_for('rename_folder') }}" method="POST">
                            <div class="modal-header border-bottom border-secondary">
                                <h5 class="modal-title">> ALTERAR_IDENTIFICADOR_NODE</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <input type="hidden" name="folder_name" value="{{ cam.original_name }}">
                                <div class="mb-3">
                                    <label class="form-label text-warning">NOVO NOME AMIGÁVEL:</label>
                                    <input type="text" class="form-control bg-dark text-light border-info" name="new_name" value="{{ cam.friendly_name }}" required>
                                </div>
                            </div>
                            <div class="modal-footer border-top border-secondary">
                                <button type="submit" class="btn btn-cyber-primary">SALVAR ALTERAÇÃO</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Relógio hacker em tempo real no topo
        setInterval(() => {
            const d = new Date();
            document.getElementById('live-clock').innerText = d.toLocaleTimeString();
        }, 1000);
    </script>
</body>
</html>
