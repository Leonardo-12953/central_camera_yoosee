<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Recuperar acesso · LYSec Play</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="auth-body">
    <div class="auth-shell">
        <div class="auth-brand">
            <div class="logo">📹 LYSec Play</div>
            <p>Recuperação de acesso</p>
        </div>

        <div class="auth-card">
            <h1>Definir nova senha</h1>
            <p class="lead">
                Esta recuperação só funciona no computador onde o programa
                está rodando. O usuário continua sendo
                <strong>{{ username }}</strong>.
            </p>

            {% if error_message %}
            <div class="alert alert-danger" role="alert">{{ error_message }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('recover') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="field">
                    <label for="password">Nova senha</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                        autofocus>
                    <span class="hint">Use pelo menos 8 caracteres.</span>
                </div>

                <div class="field">
                    <label for="confirmation">Confirme a nova senha</label>
                    <input
                        type="password"
                        id="confirmation"
                        name="confirmation"
                        autocomplete="new-password"
                        minlength="8"
                        required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Salvar nova senha
                </button>
            </form>

            <div class="auth-links">
                <a href="{{ url_for('login') }}">Voltar para o login</a>
            </div>
        </div>
    </div>
</body>
</html>
